<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173f39">
    <title>生词本 · Mdict</title>
    <link rel="stylesheet" href="/static/ui.css">
    <link rel="stylesheet" href="/static/vocabulary.css">
    <script defer src="/static/purify.min.js"></script>
    <script defer src="/static/app.js"></script>
    <script defer src="/static/alpine.min.js"></script>
</head>
<body class="dictionary-app" data-page="vocabulary" x-data="app()">
    <a class="skip-link" href="#notebook-search">跳到生词本</a>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand" aria-label="Mdict 首页">
                <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.5C9 4.5 5 4.5 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-2-.5-6-.5-9 1.5Z"/><path d="M12 6.5V20"/></svg></span>
                <span>Mdict<span class="brand-subtitle">私人词典</span></span>
            </a>
            <nav class="header-nav" aria-label="主导航">
                <a href="/">词典查询</a>
                <a href="/vocabulary" class="nav-current" aria-current="page">生词本</a>
                <a href="/admin" x-show="user?.permissions?.is_dict_admin || user?.permissions?.is_user_admin" x-cloak>管理后台</a>
            </nav>
            <div class="account-area">
                <a class="mobile-notebook" href="/vocabulary" aria-current="page">生词本</a>
                <template x-if="user"><div class="account-area"><a class="mobile-admin" href="/admin" x-show="user.permissions?.is_dict_admin || user.permissions?.is_user_admin">管理</a><span class="account-name" x-text="user.username"></span><button class="text-button" @click="logout()">退出</button></div></template>
                <button x-show="!user" class="button button-small" @click="openLogin()">登录账户 <span aria-hidden="true">↗</span></button>
            </div>
        </div>
    </header>

    <main class="workspace notebook-workspace">
        <section class="notebook-gate" x-show="!user" x-cloak>
            <h2>我的生词本</h2>
            <p>登录后，查看已收录的生词。</p>
            <button class="button" type="button" @click="openLogin()">登录账户</button>
        </section>
        <section class="notebook-page" x-show="user" x-cloak aria-labelledby="notebook-title">
            <header class="notebook-header"><h2 id="notebook-title">我的生词本</h2><p>把陌生的词，慢慢变熟悉。</p></header>
            <form class="notebook-filters" @submit.prevent="loadVocabularyList()">
                <label class="sr-only" for="notebook-search">查找生词</label><input id="notebook-search" x-ref="vocabularySearch" type="search" x-model="vocabularyKeyword" maxlength="200" placeholder="查找生词…" @input.debounce.250ms="loadVocabularyList()">
                <label class="sr-only" for="notebook-level">筛选生词级别</label><select id="notebook-level" x-model="vocabularyFilter" @change="loadVocabularyList()"><option value="">全部级别</option><template x-for="level in 5" :key="level"><option :value="String(level)" x-text="'★'.repeat(level) + ' · ' + level + ' 级'"></option></template></select>
            </form>
            <p class="vocabulary-feedback" x-show="vocabularyError" role="alert" x-cloak><span x-text="vocabularyError"></span> <button class="text-button" @click="loadVocabularyList(vocabularyPage)">重试</button></p>
            <div class="notebook-content" :aria-busy="vocabularyLoading">
                <p class="notebook-message" x-show="vocabularyLoading" role="status">正在翻开生词本…</p>
                <p class="notebook-message" x-show="!vocabularyLoading && !vocabularyError && !vocabularyItems.length" x-text="vocabularyKeyword || vocabularyFilter ? '没有符合条件的生词，试试其他筛选。' : '生词本还是空的。查词后点击单词旁的星星，即可收录。'"></p>
                <ul x-show="!vocabularyLoading && !vocabularyError" aria-label="已保存的生词">
                    <template x-for="item in vocabularyItems" :key="item.word"><li class="notebook-row">
                        <a class="notebook-word" :href="'/?word=' + encodeURIComponent(item.word)" :title="'查询 ' + item.word" x-text="item.word"></a>
                        <div class="vocabulary-stars" role="group" :aria-label="item.word + ' 的生词级别'"><template x-for="star in 5" :key="star"><button type="button" class="vocabulary-star" :class="star <= item.level && 'is-filled'" :disabled="!!vocabularySaving" :aria-pressed="item.level === star" :aria-label="item.level === star ? '从生词本移除 ' + item.word : '将 ' + item.word + ' 设为 ' + star + ' 级'" @click="setVocabularyLevel(item.word, star, item.level)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.85 5.77 6.37.93-4.61 4.49 1.09 6.34L12 17.34l-5.7 2.99 1.09-6.34L2.78 9.5l6.37-.93Z"/></svg></button></template></div>
                        <button class="notebook-remove" type="button" :disabled="!!vocabularySaving" @click="setVocabularyLevel(item.word, 0, item.level)" :aria-label="'从生词本移除 ' + item.word">移除</button>
                    </li></template>
                </ul>
            </div>
            <footer class="notebook-footer"><span x-text="'共 ' + vocabularyTotal + ' 个生词'"></span><div class="notebook-pages" x-show="vocabularyTotal > 30"><button type="button" :disabled="vocabularyPage <= 1 || vocabularyLoading || !!vocabularySaving" @click="loadVocabularyList(vocabularyPage - 1)">上一页</button><span x-text="vocabularyPage + ' / ' + Math.ceil(vocabularyTotal / 30)"></span><button type="button" :disabled="vocabularyPage * 30 >= vocabularyTotal || vocabularyLoading || !!vocabularySaving" @click="loadVocabularyList(vocabularyPage + 1)">下一页</button></div></footer>
        </section>
    </main>

    <div class="modal-backdrop" x-show="showLogin" x-cloak @click.self="closeLogin()" @keydown.escape.window="if (showLogin) closeLogin()">
        <section class="login-dialog" role="dialog" aria-modal="true" aria-labelledby="login-title" @keydown.tab="trapLoginFocus($event)">
            <button class="dialog-close" type="button" @click="closeLogin()" aria-label="关闭登录">×</button>
            <span class="eyebrow">WELCOME BACK</span><h2 id="login-title">回到你的词典空间</h2><p>登录后，继续查看生词本。</p>
            <form @submit.prevent="login()">
                <label for="login-username">用户名</label><input id="login-username" x-ref="loginUsername" type="text" x-model="loginForm.username" autocomplete="username" required>
                <label for="login-password">密码</label><input id="login-password" type="password" x-model="loginForm.password" autocomplete="current-password" required>
                <p x-show="loginError" class="login-error" role="alert" x-text="loginError"></p>
                <button type="submit" class="button" :disabled="loginLoading" x-text="loginLoading ? '正在登录…' : '登录账户 →'">登录账户 →</button>
            </form>
        </section>
    </div>
</body>
</html>
